plugins { id 'com.android.application' }

android {
    namespace 'app.lineapilot.android'
    compileSdk 35
    defaultConfig {
        applicationId 'app.lineapilot.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        persistent {
            if (System.getenv('ANDROID_SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('ANDROID_SIGNING_STORE_FILE'))
                storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            if (System.getenv('ANDROID_SIGNING_STORE_FILE')) {
                signingConfig signingConfigs.persistent
            }
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (android.jar only has stubs).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}


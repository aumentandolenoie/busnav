name: LineaPilot
options:
  bundleIdPrefix: app.lineapilot
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LineaPilot:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist]
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lineapilot.native
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LineaPilotLayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LineaPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LineaPilot:
    build:
      targets:
        LineaPilot: all
    test:
      targets:
        - LineaPilotLayoutTests

name: LineaPilot regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app and Academy catalog
        run: node --test tests/*.test.cjs
      - name: Verify Valhalla road matching never changes official GPX
        run: python3 -m unittest discover -s tests -p 'test_road_guidance.py' -v

name: LineaPilot Android APK (prototipo)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/prepare-android.sh'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'official-routes.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/prepare-android.sh'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'official-routes.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepara web app offline e GPX Academy originali
        run: bash scripts/prepare-android.sh
      - name: Firma stabile se configurata
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 --decode > android/lineapilot-signing.jks
            echo "ANDROID_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/android/lineapilot-signing.jks" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::APK firmata con chiave debug temporanea: le versioni successive potrebbero richiedere disinstallazione prima di aggiornare."
          fi
      - name: Compila APK Android installabile
        run: gradle -p android --no-daemon assembleDebug
      - name: Pubblica APK come prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-$(git rev-parse --short=12 HEAD)"
          cp android/app/build/outputs/apk/debug/app-debug.apk LineaPilot-debug.apk
          gh release create "$TAG" LineaPilot-debug.apk \
            --title "LineaPilot Android APK - $TAG" \
            --notes "APK sperimentale con GPS in primo piano e voce italiana Android. Se non è configurata una chiave Android stabile, serve disinstallare la precedente build per installare la nuova. Installazione sempre manuale. GPX Academy obbligatori e immutati." \
            --prerelease --target "$GITHUB_SHA"

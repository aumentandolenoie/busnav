name: LineaPilot Android native APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - 'app.js'
      - 'route-stops.js'
      - 'index.html'
      - 'style.css'
      - 'official-routes.json'
      - 'academy-supplemental-routes.json'
      - 'academy-evidence.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - 'app.js'
      - 'route-stops.js'
      - 'index.html'
      - 'style.css'
      - 'official-routes.json'
      - 'academy-supplemental-routes.json'
      - 'academy-evidence.json'
      - '.github/workflows/android-apk.yml'
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reuse the same verified road instructions as iOS
        id: reuse
        env:
          ROAD_GUIDANCE_WAIT_SECONDS: 4500
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reuse_road_guidance.py
      - name: Generate verified guidance if no compatible release exists
        if: steps.reuse.outputs.reused != 'true'
        run: |
          python3 -m pip install scipy
          bash scripts/build-road-guidance.sh
      - name: Regression tests and full stop audit
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_road_guidance.py' -v
          python3 scripts/download_gtfs_for_audit.py build/android-audit-feed.json --snapshot tests/fixtures/busitalia-patterns-2026-11-08.zip
          node scripts/audit_stops.cjs build/android-audit-feed.json build/android-stop-coverage.json
      - name: Prepara web app offline e GPX Academy originali
        run: bash scripts/prepare-android.sh
      - name: Firma stabile se configurata
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 --decode > android/lineapilot-signing.jks
            echo "ANDROID_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/android/lineapilot-signing.jks" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::APK firmata con chiave debug temporanea: le versioni successive potrebbero richiedere disinstallazione prima di aggiornare."
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lineapilot-android-debug-signing-v1
      - name: Compile APK and test native GPX tracker
        run: |
          gradle -p android --no-daemon testDebugUnitTest assembleDebug
          python3 scripts/verify-android-apk.py
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native preview and navigation controls on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            gradle -p android --no-daemon connectedDebugAndroidTest
            adb logcat -d -s LineaPilotMap:I
            adb pull /sdcard/Download/lineapilot-navigation-standard.png build/android-native-navigation.png
            adb shell settings put system font_scale 1.5
            gradle -p android --no-daemon connectedDebugAndroidTest --rerun-tasks
            adb pull /sdcard/Download/lineapilot-navigation-large.png build/android-native-large-text.png
            python3 -c "from pathlib import Path; files=[Path('build/android-native-navigation.png'),Path('build/android-native-large-text.png')]; assert all(p.stat().st_size>1000 and p.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for p in files)"

      - name: Pubblica APK come prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-$(git rev-parse --short=12 HEAD)"
          git fetch origin main
          git diff --exit-code "$GITHUB_SHA" origin/main -- . ':(exclude)reports/**'
          cp android/app/build/outputs/apk/debug/app-debug.apk LineaPilot-debug.apk
          gh release create "$TAG" LineaPilot-debug.apk build/android-stop-coverage.csv build/android-native-navigation.png build/android-native-large-text.png \
            --title "LineaPilot Android APK - $TAG" \
            --notes "APK con anteprima e navigazione native MapLibre/OSM, GPS e voce Android nativi, GPX ufficiali immutati e copertura vocale identica alla build iOS. Test nativi e controlli di layout su emulatore Android eseguiti. Se non è configurata una chiave Android stabile, serve disinstallare la precedente build per installare la nuova. Installazione sempre manuale. GPX Academy obbligatori e immutati." \
            --prerelease --target main

      - name: Preserve native Android layout previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p reports/layout-previews
          cp build/android-native-navigation.png build/android-native-large-text.png reports/layout-previews/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/layout-previews/android-native-navigation.png reports/layout-previews/android-native-large-text.png
          git diff --cached --quiet || git commit -m 'Save verified native Android layout previews'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

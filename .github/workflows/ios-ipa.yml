name: LineaPilot iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'scripts/**', 'app.js', 'route-stops.js', 'index.html', 'style.css', 'sw.js', 'manifest.webmanifest', 'apple-touch-icon.png', 'icons/**', 'official-routes.json', 'academy-supplemental-routes.json', 'academy-evidence.json', 'road-guidance/**', '.github/workflows/ios-ipa.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'scripts/**', 'app.js', 'route-stops.js', 'index.html', 'style.css', 'sw.js', 'manifest.webmanifest', 'apple-touch-icon.png', 'icons/**', '.github/workflows/ios-ipa.yml']
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  road-data:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install geometry validator
        run: python3 -m pip install scipy
      - name: Test instruction validation
        run: python3 -m unittest discover -s tests -p 'test_road_guidance.py' -v
      - name: Reuse recent validated annotations for the same official GPX
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reuse_road_guidance.py
      - name: Build current OSM graph and annotate immutable official GPX
        if: steps.reuse.outputs.reused != 'true'
        run: bash scripts/build-road-guidance.sh
      - name: Publish navigation data and exact coverage report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-preview-${GITHUB_SHA:0:12}"
          zip -qr navigation-data.zip road-guidance
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "LineaPilot · $TAG" --notes "Build in preparazione. GPX Academy intatti. Vedi coverage.json per le istruzioni stradali disponibili."
          gh release upload "$TAG" navigation-data.zip road-guidance/coverage.json --clobber
      - name: Valhalla diagnostic logs
        if: failure()
        run: docker logs --tail 150 busnav-valhalla || true
  build-ios:
    needs: road-data
    if: always() && (needs.road-data.result == 'success' || github.event_name == 'pull_request')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Load validated road instructions
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "ios-preview-${GITHUB_SHA:0:12}" --pattern navigation-data.zip
          unzip -oq navigation-data.zip
      - name: Audit every official GPX against the dated Busitalia pattern snapshot
        run: |
          python3 scripts/download_gtfs_for_audit.py build/audit-feed.json --snapshot tests/fixtures/busitalia-patterns-2026-11-08.zip
          node scripts/audit_stops.cjs build/audit-feed.json reports/stop-coverage.json
      - name: Regression tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_road_guidance.py' -v
          swiftc ios/Sources/GPXTracker.swift ios/Sources/GuidanceCoverage.swift tests/main.swift -o /tmp/gpx-tests
          /tmp/gpx-tests
      - name: Prepare bundled web assets
        run: bash scripts/prepare-ios.sh
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd ios && xcodegen generate)
      - name: Compile and validate unsigned device IPA for LiveContainer
        run: bash scripts/build-ios-unsigned.sh
      - name: Publish installable LiveContainer package
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-preview-${GITHUB_SHA:0:12}"
          gh release upload "$TAG" build/ios/LineaPilot-unsigned.ipa reports/stop-coverage.csv --clobber
          gh release edit "$TAG" --notes "IPA unsigned da importare in LiveContainer. Mappa Apple nativa, GPX Academy vincolanti, fermate selezionate e voce italiana. Istruzioni Valhalla/OSM incluse solo dove il confronto geometrico col GPX supera i controlli; copertura completa o parziale e intervalli mancanti in coverage.json. Fermate complete e proposte da verificare sono distinte; controlli di tutti i GPX in stop-coverage.csv. In LiveContainer tenere l'app in primo piano. Compilazione e test automatici verificati; GPS, audio e stabilità richiedono prova su iPhone."

      - name: Preserve the full stop audit in the repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish from a clean, isolated worktree; Xcode rewrites Info.plist.
          # Concurrent preview/report commits must not conflict on generated dates.
          REPORT_PUBLISH_DIR=$(mktemp -d)
          git fetch origin main
          git worktree add --detach "$REPORT_PUBLISH_DIR" origin/main
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- app.js route-stops.js official-routes.json academy-supplemental-routes.json academy-evidence.json scripts/audit_stops.cjs; then
              echo 'New matching source already on main; keep this audit in its release.'
              exit 0
            fi
            git -C "$REPORT_PUBLISH_DIR" reset --hard origin/main
            cp reports/stop-coverage.json reports/stop-coverage.csv "$REPORT_PUBLISH_DIR/reports/"
            git -C "$REPORT_PUBLISH_DIR" add reports/stop-coverage.json reports/stop-coverage.csv
            git -C "$REPORT_PUBLISH_DIR" diff --cached --quiet && exit 0
            git -C "$REPORT_PUBLISH_DIR" commit -m 'Update stop coverage audit for all 789 immutable GPX'
            if git -C "$REPORT_PUBLISH_DIR" push origin HEAD:main; then exit 0; fi
          done
          echo 'Unable to publish audit after concurrent updates.'
          exit 1

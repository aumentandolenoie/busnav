name: iOS native navigation checks
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'tests/main.swift', '.github/workflows/ios-native-check.yml']
permissions:
  contents: read
jobs:
  native-check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native GPX matching
        run: |
          swiftc ios/Sources/GPXTracker.swift ios/Sources/GuidanceCoverage.swift tests/main.swift -o /tmp/gpx-tests
          /tmp/gpx-tests
      - name: Generate native project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/reuse_road_guidance.py
          test -s road-guidance/coverage.json
          bash scripts/prepare-ios.sh
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd ios && xcodegen generate)
      - name: Compile actual iPhone application
        run: bash scripts/build-ios-unsigned.sh


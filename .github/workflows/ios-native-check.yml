name: iOS native navigation checks
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'tests/main.swift', '.github/workflows/ios-native-check.yml']
permissions:
  contents: write
jobs:
  native-check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native GPX matching
        run: |
          swiftc ios/Sources/GPXTracker.swift ios/Sources/GuidanceCoverage.swift tests/main.swift -o /tmp/gpx-tests
          /tmp/gpx-tests
      - name: Generate native project
        run: |
          bash scripts/prepare-ios.sh
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd ios && xcodegen generate)
      - name: Check native touch targets and safe areas on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(v['udid'] for vs in d['devices'].values() for v in vs if v['name'].startswith('iPhone')))")
          xcodebuild -project ios/LineaPilot.xcodeproj -scheme LineaPilot -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/layout-tests -resultBundlePath build/navigation-layout.xcresult test CODE_SIGNING_ALLOWED=NO > build/layout-tests.log 2>&1 || { tail -n 140 build/layout-tests.log; exit 1; }
      - name: Save native layout results without Actions artifact storage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f build/layout-tests.log || exit 0
          TAG="ios-preview-${GITHUB_SHA:0:12}"
          gh release view "$TAG" >/dev/null 2>&1 || TAG="layout-audit-${GITHUB_SHA:0:12}"
          zip -qr native-layout-results.zip build/layout-tests.log build/navigation-layout.xcresult || true
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target main --title "Verifica layout iPhone · $TAG" --notes "Risultati e screenshot del test nel simulatore iOS. Non contiene una IPA."
          gh release upload "$TAG" native-layout-results.zip --clobber
      - name: Preserve a native navigation preview
        if: success()
        run: |
          xcrun xcresulttool export attachments --path build/navigation-layout.xcresult --output-path build/native-layout-previews
          python3 - <<'PYIMAGE'
          from pathlib import Path
          images=sorted(Path('build/native-layout-previews').rglob('*.png'))
          assert images, 'No native test screenshots exported'
          target=Path('reports/layout-previews/native-navigation.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(images[0].read_bytes())
          PYIMAGE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/layout-previews/native-navigation.png
          git diff --cached --quiet || git commit -m 'Save verified native navigation preview'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

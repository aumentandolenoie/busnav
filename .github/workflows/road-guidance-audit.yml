name: Audit published road instruction dataset
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/road-guidance-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual previously published guidance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/reuse_road_guidance.py
          test -s build/road-guidance-before.json
          python3 -c "import json; d=json.load(open('build/road-guidance-before.json')); print(json.dumps({k:v for k,v in d.items() if k!='samples'},indent=2))"
          cp build/road-guidance-before.json reports/road-guidance-before.json
      - name: Preserve reproducible instruction audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/road-guidance-before.json
          git diff --cached --quiet || git commit -m 'Audit exit numbers in the previously published guidance'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

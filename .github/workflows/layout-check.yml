name: iPhone web layout checks
on:
  workflow_dispatch:
  push:
    paths: ['style.css', 'index.html', 'app.js', 'tests/layout-browser.py', 'tests/safari-voice-browser.py', '.github/workflows/layout-check.yml']
permissions:
  contents: write
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install playwright
      - run: python3 -m playwright install --with-deps chromium webkit
      - run: python3 tests/layout-browser.py
      # Web app on iPhone Safari: voice unlock rule and driving view with the real JS (WebKit + Chromium).
      - run: python3 tests/safari-voice-browser.py
      - name: Save browser screenshots without Actions artifact storage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d build/layout-browser || exit 0
          TAG="ios-preview-${GITHUB_SHA:0:12}"
          gh release view "$TAG" >/dev/null 2>&1 || TAG="layout-audit-${GITHUB_SHA:0:12}"
          zip -qr layout-screenshots.zip build/layout-browser
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target main --title "Verifica layout iPhone · $TAG" --notes "Screenshot e risultati dei controlli su safe area, sovrapposizioni e dimensioni dei pulsanti. Non contiene una IPA."
          gh release upload "$TAG" layout-screenshots.zip --clobber
      - name: Preserve representative browser layout previews
        if: success()
        run: |
          mkdir -p reports/layout-previews
          cp build/layout-browser/webkit-navigation-390x844-0.png reports/layout-previews/iphone-navigation.png
          cp build/layout-browser/webkit-navigation-320x568-1.png reports/layout-previews/compact-large-text.png
          cp build/layout-browser/results.json reports/layout-previews/browser-results.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/layout-previews
          git diff --cached --quiet || git commit -m 'Save browser safe-area layout evidence'
          git pull --rebase origin main
          git push origin HEAD:main

name: Prepara manovre italiane (GPX Academy vincolante)
on:
  workflow_dispatch:
    inputs:
      academy_id:
        description: "ID esatto di un GPX Academy da elaborare"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VALHALLA_ENDPOINT: ${{ secrets.VALHALLA_ENDPOINT }}
      ACADEMY_ID: ${{ inputs.academy_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validazione parametri
        run: |
          if [ -z "$VALHALLA_ENDPOINT" ]; then
            echo "::error::Imposta il secret VALHALLA_ENDPOINT verso un servizio Valhalla proprio/autorizzato."
            exit 1
          fi
          if ! [[ "$ACADEMY_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::ID Academy non valido."
            exit 1
          fi
      - name: Genera e verifica le istruzioni stradali italiane
        run: python3 scripts/enrich_road_guidance.py --route-id "$ACADEMY_ID" --endpoint "$VALHALLA_ENDPOINT"
      - name: Test di sicurezza sul percorso Academy
        run: python3 -m unittest discover -s tests -p 'test_road_guidance.py' -v
      - name: Apri una pull request (mai modifica automatica ai GPX)
        run: |
          BRANCH="road-guidance/academy-$ACADEMY_ID-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "road-guidance/$ACADEMY_ID.json"
          git commit -m "Italian road maneuvers for Academy $ACADEMY_ID (validated)"
          git push origin "$BRANCH"
          gh pr create --title "Manovre italiane GPX Academy $ACADEMY_ID" \
            --body "Dati generati da Valhalla bus trace_route in italiano, con controlli di scostamento, lunghezza, progressione e fingerprint completa. I GPX ufficiali non sono modificati. Richiede revisione prima del merge. Nessuna deviazione automatica consentita." \
            --head "$BRANCH" --base main
